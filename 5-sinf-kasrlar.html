<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5-sinf matematika — Kasrlar</title>
<style>
:root{--ink:#172033;--muted:#64748b;--blue:#3157d5;--pale:#eef3ff;--line:#dce4f2;--green:#16845b;--orange:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fc;color:var(--ink);line-height:1.55}
header{background:linear-gradient(125deg,#203a9b,#496de5);color:white;padding:28px 18px 24px}
.wrap{max-width:980px;margin:auto;padding:0 16px}header h1{font-size:clamp(25px,5vw,38px);line-height:1.15;margin:8px 0}header p{margin:8px 0 0;color:#e5ebff}
.tag{display:inline-block;background:#ffffff25;border:1px solid #ffffff55;padding:5px 10px;border-radius:30px;font-size:13px}
main{padding:20px 0 50px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;scrollbar-width:thin}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;color:#334155;border-radius:30px;padding:10px 14px;font-weight:650;cursor:pointer}
.tabs button.active{background:var(--blue);border-color:var(--blue);color:white}
.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(17px,4vw,28px);box-shadow:0 8px 24px #243b6810}
h2{margin:0 0 8px;font-size:clamp(22px,4vw,29px)}h3{margin:22px 0 8px;font-size:18px}
.lead{color:var(--muted);margin-top:0}.rule{background:var(--pale);border-left:4px solid var(--blue);padding:13px 15px;border-radius:10px;margin:16px 0}
.example{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcff}
.step b{color:var(--blue)}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;line-height:1.1;margin:0 3px;font-weight:700}.frac span:first-child{border-bottom:2px solid currentColor;padding:0 5px 3px}.frac span:last-child{padding:3px 5px 0}
.math{font-size:clamp(20px,4vw,27px);font-weight:700;letter-spacing:.3px}
.visual{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.cell{width:35px;height:35px;border:2px solid #9aa9c7;border-radius:7px;background:#fff}.cell.fill{background:#6d8df0;border-color:#6d8df0}
.quiz{margin-top:22px;padding:16px;background:#f8fafc;border:1px solid var(--line);border-radius:14px}
.quiz input{width:110px;max-width:45%;padding:10px;border:1px solid #aebbd0;border-radius:9px;font-size:17px}
button.action{border:0;background:var(--blue);color:white;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;margin:5px 4px 5px 0}
button.secondary{background:#e9eefb;color:#263e99}
.feedback{font-weight:650;min-height:26px;margin-top:8px}.good{color:var(--green)}.bad{color:#b45309}
footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}
@media(min-width:700px){.example{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="wrap"><span class="tag">5-sinf matematika • Interaktiv dars</span><h1>Kasrlar bilan amallar</h1><p>O‘rganing, ko‘rgazmali misollarni kuzating va bilimlaringizni sinab ko‘ring.</p></div></header>
<main class="wrap">
<nav class="tabs" id="tabs" aria-label="Mavzular"></nav>
<section class="panel" id="lesson" aria-live="polite"></section>
</main>
<footer>5-sinf matematika uchun o‘quv materiali</footer>
<script>
const topics=[
{title:"To‘g‘ri kasrlarni qo‘shish",rule:"Maxrajlari bir xil bo‘lsa, suratlarni qo‘shamiz. Maxraj o‘zgarmaydi.",formula:"1/5 + 2/5 = 3/5",steps:["Maxrajlar bir xil: 5 va 5.","Suratlarni qo‘shamiz: 1 + 2 = 3.","Maxrajni o‘zgarishsiz qoldiramiz: 3/5."],q:"2/7 + 3/7 = ?",a:"5/7",visual:5,filled:3},
{title:"To‘g‘ri kasrlarni ayirish",rule:"Maxrajlari bir xil bo‘lsa, suratlarni ayiramiz. Maxraj o‘zgarmaydi.",formula:"4/6 − 1/6 = 3/6 = 1/2",steps:["Maxrajlar bir xil: 6 va 6.","Suratlarni ayiramiz: 4 − 1 = 3.","3/6 ni 1/2 gacha qisqartirish mumkin."],q:"5/8 − 2/8 = ?",a:"3/8",visual:8,filled:3},
{title:"To‘g‘ri kasrlarni ko‘paytirish",rule:"Suratni suratga, maxrajni maxrajga ko‘paytiramiz. So‘ng qisqartirish mumkin.",formula:"1/2 × 2/3 = 2/6 = 1/3",steps:["Suratlar: 1 × 2 = 2.","Maxrajlar: 2 × 3 = 6.","Natija 2/6; 2 ga qisqartiramiz: 1/3."],q:"2/3 × 1/4 = ?",a:"1/6",visual:6,filled:2},
{title:"Kasrlarni bo‘lish",rule:"Kasrga bo‘lish — uning teskarisiga ko‘paytirish demakdir.",formula:"1/2 ÷ 1/4 = 1/2 × 4/1 = 2",steps:["Ikkinchi kasrni teskarisiga aylantiramiz: 1/4 → 4/1.","Bo‘lish o‘rniga ko‘paytiramiz.","1 × 4 / (2 × 1) = 4/2 = 2."],q:"1/3 ÷ 1/6 = ?",a:"2",visual:3,filled:1},
{title:"To‘g‘ri va noto‘g‘ri kasrlarni ko‘paytirish",rule:"Kasrlar turidan qat’i nazar, suratlar o‘zaro, maxrajlar o‘zaro ko‘paytiriladi.",formula:"2/3 × 3/2 = 6/6 = 1",steps:["Suratlar: 2 × 3 = 6.","Maxrajlar: 3 × 2 = 6.","6/6 = 1."],q:"1/2 × 5/3 = ?",a:"5/6",visual:6,filled:5},
{title:"Natural sonni kasrga ko‘paytirish",rule:"Natural sonni kasrning suratiga ko‘paytiramiz, maxraj esa o‘zgarishsiz qoladi.",formula:"3 × 1/4 = 3/4",steps:["3 ni kasr ko‘rinishida yozamiz: 3/1.","3/1 × 1/4 = 3/4.","Javob: 3/4."],q:"2 × 2/5 = ?",a:"4/5",visual:5,filled:4}
];
let current=0;
const tabs=document.getElementById('tabs'),lesson=document.getElementById('lesson');
function draw(){
tabs.innerHTML=topics.map((t,i)=>`<button class="${i===current?'active':''}" data-i="${i}">${i+1}. ${t.title}</button>`).join('');
tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=+b.dataset.i;draw()});
const t=topics[current];
lesson.innerHTML=`<h2>${t.title}</h2><p class="lead">Mavzuni bosqichma-bosqich o‘rganamiz.</p><div class="rule"><b>Qoida:</b> ${t.rule}</div><h3>Misol</h3><div class="math">${t.formula}</div><div class="example">${t.steps.map((s,i)=>`<div class="step"><b>${i+1}-qadam.</b> ${s}</div>`).join('')}</div><h3>Kasrni ko‘rgazmali ko‘rish</h3><p class="lead">Bo‘laklarning ko‘k rangga bo‘yalgan qismi kasrning suratini ko‘rsatadi.</p><div class="visual">${Array.from({length:t.visual},(_,i)=>`<span class="cell ${i<t.filled?'fill':''}"></span>`).join('')}</div><div class="quiz"><h3>O‘zingizni sinang</h3><p><b>${t.q}</b></p><label>Javob: <input id="answer" placeholder="Masalan, 1/2" autocomplete="off"></label> <button class="action" id="check">Tekshirish</button><button class="action secondary" id="show">Javobni ko‘rish</button><div class="feedback" id="feedback"></div></div><div style="margin-top:18px;display:flex;justify-content:space-between;gap:8px"><button class="action secondary" id="prev" ${current===0?'disabled':''}>← Oldingi</button><button class="action" id="next" ${current===topics.length-1?'disabled':''}>Keyingi →</button></div>`;
document.getElementById('check').onclick=()=>{let v=document.getElementById('answer').value.trim().replace(/\s/g,'');let f=document.getElementById('feedback');if(v===t.a){f.textContent='Barakalla! Javobingiz to‘g‘ri.';f.className='feedback good'}else{f.textContent='Yana bir bor urinib ko‘ring. Qoidani eslang.';f.className='feedback bad'}};
document.getElementById('show').onclick=()=>{document.getElementById('feedback').textContent='To‘g‘ri javob: '+t.a;document.getElementById('feedback').className='feedback'};
document.getElementById('prev').onclick=()=>{if(current>0){current--;draw();window.scrollTo(0,0)}};
document.getElementById('next').onclick=()=>{if(current<topics.length-1){current++;draw();window.scrollTo(0,0)}};
}
draw();
</script>
</body>
</html>
